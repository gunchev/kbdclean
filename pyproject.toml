[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kbdclean"
dynamic = ["version"]
description = "Grab all keyboards for safe physical cleaning"
readme = "README.md"
license = { text = "Unlicense" }
authors = [
    { name = "Doncho Nikolaev Gunchev", email = "dgunchev@gmail.com" }
]
keywords = ["keyboard", "cleaning", "utility", "pygame"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "evdev>=1.7.0",
    "pyqt6>=6.6.0",
]

[project.scripts]
kbdclean = "kbdclean.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kbdclean"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "flake8", "pylint"]

[tool.hatch.version]
path = "src/kbdclean/__init__.py"

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
# Renderer is a stateful drawing object — it legitimately needs many attributes.
max-attributes = 20
max-locals = 25
max-args = 7

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.autopep8]
max_line_length = 120
recursive = true
in-place = true
